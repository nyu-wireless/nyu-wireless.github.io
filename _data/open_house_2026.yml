# NYU WIRELESS Board Meeting and Open House 2026.
# All the event details live here; the pages under _pages/events/open-house-2026/
# (layout: event) read them. Update this file to change dates, the agenda,
# demos or photos.

title: "Board Meeting and Open House"
date_label: "Tuesday, November 3, 2026"
tagline: "Join NYU WIRELESS in Brooklyn for our annual board meeting with our industrial affiliates, followed by an afternoon open house with student posters and live lab demos."
hero_image: /assets/images/events/open-house.jpg
hero_caption: "A student poster at the NYU WIRELESS Open House"
address: "370 Jay Street, Brooklyn, NY 11201"
contact_name: "Teresa Wang"
contact_email: "info@nyuwireless.com"
register_by: "October 23, 2026"

# Tabs shown under the page title
pages:
  - title: "Overview"
    url: /events/open-house-2026/
  - title: "Agenda"
    url: /events/open-house-2026/agenda/
  - title: "Posters"
    url: /events/open-house-2026/posters/
  - title: "Demos"
    url: /events/open-house-2026/demos/
  - title: "Visiting"
    url: /events/open-house-2026/visiting/

# The two parts of the day
sessions:
  - name: "Board Meeting"
    time: "10:00am – 3:00pm ET"
    place: "370 Jay Street, 12th floor"
    audience: "Industrial affiliates"
    text: "Our industrial affiliates hear the latest from the center, meet the faculty and help shape its direction for the coming year."
    rsvp_label: "Affiliate RSVP"
    rsvp_url: "https://docs.google.com/forms/d/103rAfmksp6zDc_eR7YB4atuMFX9Oqw_raKEJ1opb9y8/viewform"
    note: "Affiliates registered for the board meeting do not need to register separately for the open house."
  - name: "Open House"
    time: "3:00pm ET"
    place: "370 Jay Street, 9th floor"
    audience: "Open to all"
    text: "Explore research from our students at the poster session, and see live demonstrations in our labs."
    rsvp_label: "Open House RSVP"
    rsvp_url: "https://docs.google.com/forms/d/e/1FAIpQLSfCwkAwFMBnvnLyx1UvqU2Ll9Tis4QmX5W9k5OZnYJBh0DWww/viewform"

# Agenda. `kind` sets the color of the row: board, break or open-house.
agenda:
  - time: "10:00am"
    title: "Welcome and agenda review"
    speaker: "Sundeep Rangan, Director, NYU WIRELESS"
    kind: board
  - time: "10:05am"
    title: "Opening remarks"
    speaker: "Juan de Pablo, Executive Dean, NYU Tandon School of Engineering"
    kind: board
  - time: "10:25am"
    title: "Industrial affiliate introductions"
    detail: "Five minutes per affiliate, no slides."
    kind: board
  - time: "10:50am"
    title: "NYU WIRELESS overview and updates"
    speaker: "Sundeep Rangan"
    kind: board
  - time: "11:30am"
    title: "Research project presentations"
    detail: "NYU WIRELESS faculty present current research projects."
    kind: board
  - time: "12:00pm"
    title: "Lunch"
    place: "12th floor"
    kind: break
  - time: "1:00pm"
    title: "Research project presentations, continued"
    kind: board
  - time: "2:00pm"
    title: "Open discussion"
    detail: "Feedback, brainstorming and industry perspectives, followed by wrap-up."
    kind: board
  - time: "3:00pm"
    title: "Open House"
    detail: "Student poster session and live lab demonstrations."
    place: "9th floor"
    kind: open-house

# Demo videos. `youtube` is the video id (the part after youtu.be/ or
# watch?v= in the URL); `url` is an optional link to the project page.
demos:
  - title: "HoRAMA: Automated 3D Wireless Digital Twins for AI-Native 6G"
    people: "Ted Rappaport, Mingjun Ying, Dipankar Shakya"
    text: "Building 3D models of real environments automatically, for calibrated ray tracing and site-specific channel prediction."
    youtube: "g3_UKaFLiHI"
    url: /projects/nyuray/
  - title: "3.7 GHz Measurement Campaign"
    people: "Ted Rappaport, Mingjun Ying, Dipankar Shakya"
    text: "Measuring radio propagation in the 6G mid-band: path loss, delay and angular spreads, and penetration loss."
    youtube: "c1dtTE_hl58"
    url: /projects/radio-propagation/
  - title: "Wireless-Aided Robotic Navigation"
    people: "Haozhe Lei, Ruibin Chen, Yuhan Jiang, Sundeep Rangan"
    text: "Robots that localize radio sources and navigate with wireless signals, demonstrated on a 10 GHz robotic testbed."
    youtube: "PJaz6TokX84"
    url: https://sdrangan.github.io/research/wireless-robotic-navigation/

