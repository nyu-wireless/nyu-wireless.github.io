# Projects shown on the research-area pages, in display order.
#   areas:     slugs from _data/areas.yml; a project appears on every area it lists.
#   pis:       NYU WIRELESS faculty on the project.
#   summary:   one sentence, at most ~120 characters, so rows stay even.
#   url:       the project's own page (usually on the PI's group site), or
#              /projects/<name>/ for a page hosted here in _projects/<name>.md.
#   image:     thumbnail; image_fit: contain for diagrams that must not be cropped,
#              image_position (CSS object-position, e.g. "center 70%") to move the crop.

