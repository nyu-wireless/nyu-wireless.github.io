# ---------------------------------------------------------------------------
# Site settings
# ---------------------------------------------------------------------------
title: "NYU WIRELESS"
tagline: "NYU Tandon"  # used in the home page browser-tab title
description: >-
  NYU WIRELESS is an academic-industry research center at the NYU Tandon
  School of Engineering, working with its industrial affiliates on
  next-generation wireless systems.
url: "https://nyu-wireless.github.io"
repository: "nyu-wireless/nyu-wireless.github.io"

# ---------------------------------------------------------------------------
# Branding (header, footer)
# ---------------------------------------------------------------------------
branding:
  name: "NYU Tandon"  # shown next to the logo in the header
  # `logo` is shown in the white header (NYU WIRELESS logo), `logo_white` in
  # the violet footer (NYU torch; files in assets/images/nyu/, where "long"
  # versions spell out NEW YORK UNIVERSITY). Leave "" to hide.
  logo: "/assets/images/nyu-wireless/nyu-wireless-color.jpg"
  logo_alt: "NYU WIRELESS"
  logo_white: "/assets/images/nyu/nyu-short-white.svg"
  footer_blurb: >-
    An academic-industry research center at the NYU Tandon School of
    Engineering, working on next-generation wireless systems.

contact:
  address: "370 Jay St, Brooklyn, NY 11201"
  nyu_wireless: "https://wireless.engineering.nyu.edu/"

# Build settings ----------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:categories/:title/
timezone: America/New_York

include:
  - _pages

exclude:
  - README.md
  - adding_projects.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - material/

# ---------------------------------------------------------------------------
# Collections: project pages hosted on this site (most projects link out)
# ---------------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:path/

# ---------------------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
