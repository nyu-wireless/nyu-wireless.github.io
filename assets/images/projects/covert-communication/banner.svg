<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Covert communication in the presence of legitimate transmission</title>
  <desc id="d">Alice transmits to Willie over a legitimate link. Tom, a hardware Trojan hidden inside Alice, sends a covert signal to the rogue receiver Eve and must avoid detection by Willie.</desc>
