<text x="796" y="165" font-size="14.5" fill="#1d1626" font-weight="600" text-anchor="middle">Rule-based checks</text>
<text x="796" y="183" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle">against expected behavior</text>
<rect x="690" y="216" width="212" height="72" rx="10" fill="#f6f1fa" stroke="#e4dde9" stroke-width="1.5"/>
<text x="796" y="249" font-size="14.5" fill="#1d1626" font-weight="600" text-anchor="middle">LLM analysis</text>
