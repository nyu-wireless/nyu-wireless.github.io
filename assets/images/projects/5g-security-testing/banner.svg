<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Automated over-the-air security testing of 5G standalone devices</title>
  <desc id="d">Test cases generated from 3GPP specifications are run over the air against a phone in a Faraday cage, then evaluated with rule-based checks and large language models.</desc>
