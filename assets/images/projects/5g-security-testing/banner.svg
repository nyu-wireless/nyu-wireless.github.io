<circle cx="70" cy="98" r="16" fill="url(#vgrad)"/><text x="70" y="104" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text>
<text x="96" y="104" font-size="17.5" fill="#57068c" font-weight="700" text-anchor="start">Generate</text>
<rect x="58" y="132" width="212" height="58" rx="10" fill="#f6f1fa" stroke="#e4dde9" stroke-width="1.5"/>
<text x="164" y="158" font-size="14.5" fill="#1d1626" font-weight="600" text-anchor="middle">NAS protocol</text>
