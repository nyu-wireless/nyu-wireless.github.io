<text x="164" y="226" font-size="14.5" fill="#1d1626" font-weight="600" text-anchor="middle">5G security</text>
<text x="164" y="244" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle">3GPP TS 33.501</text>
<rect x="58" y="268" width="212" height="58" rx="10" fill="#f6f1fa" stroke="#e4dde9" stroke-width="1.5"/>
<text x="164" y="294" font-size="14.5" fill="#1d1626" font-weight="600" text-anchor="middle">Open5GS core</text>
<text x="164" y="312" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle">supported messages</text>
