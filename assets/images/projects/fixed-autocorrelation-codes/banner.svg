<text x="818" y="306" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle">lag</text>
<rect x="432" y="444" width="484" height="88" rx="14" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<text x="674" y="480" font-size="15.5" fill="#1d1626" font-weight="600" text-anchor="middle">Noncoherent short packets</text>
<text x="674" y="506" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">The receiver works without instantaneous channel state information</text>
</svg>
