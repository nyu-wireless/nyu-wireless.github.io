<rect x="720" y="126" width="196" height="200" rx="14" fill="#fff" stroke="#57068c" stroke-width="1.5" filter="url(#sh)"/>
<text x="818" y="160" font-size="14.5" fill="#1d1626" font-weight="600" text-anchor="middle">…one autocorrelation</text>
