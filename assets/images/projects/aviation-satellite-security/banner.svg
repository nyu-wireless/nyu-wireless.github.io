<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Verifying aviation and satellite signals</title>
  <desc id="d">Four receivers on the ground and in space verify the position reported by an aircraft against a spoofed one, and a distress beacon appends a timestamp and message authentication code to its satellite uplink.</desc>
