<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Constrained deep RL for timely packet delivery</title>
  <desc id="d">Packets travel from a source to an XR client over two multi-hop paths. Each node holds queues of packets colored by remaining lifetime, from fresh to near deadline; expired packets are dropped. A centralized RL router chooses paths and RL schedulers at each node decide what to forward.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9fc"/><stop offset="1" stop-color="#f1eaf6"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0" x2="1">
      <stop offset="0" stop-color="#57068c"/><stop offset="1" stop-color="#8900e1"/>
    </linearGradient>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57068c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6d6578"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00979a"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e0a32" flood-opacity=".10"/></filter>
  </defs>
  <rect width="960" height="576" fill="url(#bg)"/>
<line x1="120" y1="300" x2="360" y2="170" stroke="#c9b3d9" stroke-width="5" stroke-linecap="round"/>
<line x1="120" y1="300" x2="360" y2="430" stroke="#c9b3d9" stroke-width="5" stroke-linecap="round"/>
<line x1="360" y1="170" x2="610" y2="170" stroke="#c9b3d9" stroke-width="5" stroke-linecap="round"/>
<line x1="360" y1="430" x2="610" y2="430" stroke="#c9b3d9" stroke-width="5" stroke-linecap="round"/>
<line x1="610" y1="170" x2="845" y2="300" stroke="#c9b3d9" stroke-width="5" stroke-linecap="round"/>
<line x1="610" y1="430" x2="845" y2="300" stroke="#c9b3d9" stroke-width="5" stroke-linecap="round"/>
<line x1="360" y1="170" x2="610" y2="430" stroke="#c9b3d9" stroke-width="5" stroke-linecap="round"/>
<polyline points="120,300 360,170 610,170 845,300" fill="none" stroke="#57068c" stroke-width="2.4" stroke-dasharray="9 7" stroke-opacity=".75"/>
<polyline points="120,300 360,430 610,430 845,300" fill="none" stroke="#8900e1" stroke-width="2.4" stroke-dasharray="9 7" stroke-opacity=".75"/>
<rect x="298" y="140" width="124" height="60" rx="12" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="322" cy="170" r="10" fill="#00979a"/>
<circle cx="347" cy="170" r="10" fill="#00979a"/>
<circle cx="372" cy="170" r="10" fill="#e07b1a"/>
<circle cx="397" cy="170" r="10" fill="#d6336c"/>
<rect x="298" y="400" width="124" height="60" rx="12" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="322" cy="430" r="10" fill="#00979a"/>
<circle cx="347" cy="430" r="10" fill="#e07b1a"/>
<circle cx="372" cy="430" r="10" fill="#e07b1a"/>
<rect x="548" y="140" width="124" height="60" rx="12" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="572" cy="170" r="10" fill="#00979a"/>
<circle cx="597" cy="170" r="10" fill="#e07b1a"/>
<circle cx="622" cy="170" r="10" fill="#d6336c"/>
<rect x="548" y="400" width="124" height="60" rx="12" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="572" cy="430" r="10" fill="#00979a"/>
<circle cx="597" cy="430" r="10" fill="#00979a"/>
<circle cx="622" cy="430" r="10" fill="#d6336c"/>
<circle cx="647" cy="430" r="10" fill="#d6336c"/>
<circle cx="686" cy="112" r="10" fill="none" stroke="#6d6578" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M648 142 Q660 110 674 110" fill="none" stroke="#6d6578" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="704" y="117" font-size="14" fill="#6d6578" font-weight="500" text-anchor="start" >expired: dropped</text>
<circle cx="120" cy="300" r="52" fill="url(#vgrad)" filter="url(#sh)"/>
<text x="120" y="296" font-size="16" fill="#fff" font-weight="600" text-anchor="middle" >Source</text>
<text x="120" y="317" font-size="13" fill="#fff" font-weight="400" text-anchor="middle" fill-opacity=".85">new packets</text>
<circle cx="845" cy="300" r="52" fill="#fff" stroke="#57068c" stroke-width="3" filter="url(#sh)"/>
<path d="M815 290 h60 v18 a8 8 0 0 1 -8 8 h-12 l-6 -8 h-8 l-6 8 h-12 a8 8 0 0 1 -8 -8z" fill="#57068c"/>
<text x="845" y="334" font-size="14" fill="#1d1626" font-weight="600" text-anchor="middle" >XR client</text>
<rect x="50" y="72" width="140" height="58" rx="29" fill="#1d1626"/>
<text x="120" y="98" font-size="15" fill="#fff" font-weight="600" text-anchor="middle" >RL router</text>
<text x="120" y="117" font-size="12.5" fill="#fff" font-weight="400" text-anchor="middle" fill-opacity=".75">centralized</text>
<line x1="120" y1="132" x2="120" y2="244" stroke="#1d1626" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ag)"/>
<circle cx="422" cy="140" r="15" fill="#1d1626"/>
<text x="422" y="145" font-size="11.5" fill="#fff" font-weight="700" text-anchor="middle" >RL</text>
<circle cx="422" cy="400" r="15" fill="#1d1626"/>
<text x="422" y="405" font-size="11.5" fill="#fff" font-weight="700" text-anchor="middle" >RL</text>
<circle cx="672" cy="140" r="15" fill="#1d1626"/>
<text x="672" y="145" font-size="11.5" fill="#fff" font-weight="700" text-anchor="middle" >RL</text>
<circle cx="672" cy="400" r="15" fill="#1d1626"/>
<text x="672" y="405" font-size="11.5" fill="#fff" font-weight="700" text-anchor="middle" >RL</text>
<text x="485" y="305" font-size="15" fill="#1d1626" font-weight="600" text-anchor="middle" stroke="#f5f0f8" stroke-width="7" paint-order="stroke">RL schedulers at each node</text>
<text x="70" y="525" font-size="15" fill="#4a4257" font-weight="600" text-anchor="start" >Packet lifetime:</text>
<circle cx="210" cy="520" r="9" fill="#00979a"/>
<text x="226" y="525" font-size="15" fill="#4a4257" font-weight="500" text-anchor="start" >fresh</text>
<circle cx="325" cy="520" r="9" fill="#e07b1a"/>
<text x="341" y="525" font-size="15" fill="#4a4257" font-weight="500" text-anchor="start" >aging</text>
<circle cx="440" cy="520" r="9" fill="#d6336c"/>
<text x="456" y="525" font-size="15" fill="#4a4257" font-weight="500" text-anchor="start" >near deadline</text>
<text x="900" y="52" font-size="16" fill="#57068c" font-weight="600" text-anchor="end" >Goal: meet a reliability target at minimum cost</text>
</svg>
