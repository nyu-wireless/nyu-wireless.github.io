  <title id="t">Learned dirty paper coding</title>
  <desc id="d">A message V enters a learned encoder that also knows the interference S. The signal X is added to S and to noise N, and a learned decoder estimates the message. The trained decoder forms near-hexagonal decision regions.</desc>
