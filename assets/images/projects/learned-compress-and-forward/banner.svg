<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Learned compress-and-forward relaying</title>
  <desc id="d">Left: a primitive relay channel. The source transmits to the destination and to a relay; the relay quantizes its observation with a learned quantizer and forwards R bits over an out-of-band link. Right: a diamond relay channel with two relays, each compressing separately with rates R1 and R2, and a destination that decodes jointly.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9fc"/><stop offset="1" stop-color="#f1eaf6"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0" x2="1">
      <stop offset="0" stop-color="#57068c"/><stop offset="1" stop-color="#8900e1"/>
    </linearGradient>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57068c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6d6578"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#00979a"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e0a32" flood-opacity=".10"/></filter>
  </defs>
  <rect width="960" height="576" fill="url(#bg)"/>
<text x="240" y="62" font-size="19" fill="#1d1626" font-weight="700" text-anchor="middle" >Relay channel</text>
<rect x="25.0" y="368" width="110" height="64" rx="14" fill="url(#vgrad)" stroke="none" stroke-width="1.8" filter="url(#sh)"/>
<text x="80" y="406" font-size="16" fill="#fff" font-weight="600" text-anchor="middle" >Source</text>
<rect x="181.0" y="143" width="118" height="64" rx="14" fill="#fff" stroke="#c9b3d9" stroke-width="1.8" filter="url(#sh)"/>
<text x="240" y="175" font-size="16" fill="#1d1626" font-weight="600" text-anchor="middle" >Relay</text>
<text x="240" y="194" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle" >learned quantizer</text>
<rect x="341.0" y="368" width="118" height="64" rx="14" fill="#fff" stroke="#c9b3d9" stroke-width="1.8" filter="url(#sh)"/>
<text x="400" y="400" font-size="16" fill="#1d1626" font-weight="600" text-anchor="middle" >Dest.</text>
<text x="400" y="419" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle" >learned demod.</text>
<line x1="110" y1="366" x2="210" y2="213" stroke="#6d6578" stroke-width="2.2" marker-end="url(#ag)"/>
<line x1="137" y1="400" x2="336" y2="400" stroke="#6d6578" stroke-width="2.2" marker-end="url(#ag)"/>
<line x1="270" y1="213" x2="372" y2="362" stroke="#57068c" stroke-width="2.8" marker-end="url(#av)"/>
<line x1="330.9" y1="280.7" x2="311.1" y2="294.3" stroke="#57068c" stroke-width="3"/>
<text x="342" y="278" font-size="16" fill="#57068c" font-weight="700" text-anchor="middle" font-style="italic">R</text>
<text x="140" y="286" font-size="16" fill="#4a4257" font-weight="600" text-anchor="middle" font-style="italic">Y<tspan font-size="11" dy="4">R</tspan></text>
<text x="236" y="428" font-size="16" fill="#4a4257" font-weight="600" text-anchor="middle" font-style="italic">Y<tspan font-size="11" dy="4">D</tspan></text>
<line x1="490" y1="70" x2="490" y2="470" stroke="#e4dde9" stroke-width="2"/>
<text x="720" y="62" font-size="19" fill="#1d1626" font-weight="700" text-anchor="middle" >Diamond relay channel</text>
<rect x="520.0" y="268" width="110" height="64" rx="14" fill="url(#vgrad)" stroke="none" stroke-width="1.8" filter="url(#sh)"/>
<text x="575" y="306" font-size="16" fill="#fff" font-weight="600" text-anchor="middle" >Source</text>
<rect x="661.0" y="123" width="118" height="64" rx="14" fill="#fff" stroke="#c9b3d9" stroke-width="1.8" filter="url(#sh)"/>
<text x="720" y="155" font-size="16" fill="#1d1626" font-weight="600" text-anchor="middle" >Relay 1</text>
<text x="720" y="174" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle" >learned quantizer</text>
<rect x="661.0" y="413" width="118" height="64" rx="14" fill="#fff" stroke="#c9b3d9" stroke-width="1.8" filter="url(#sh)"/>
<text x="720" y="445" font-size="16" fill="#1d1626" font-weight="600" text-anchor="middle" >Relay 2</text>
<text x="720" y="464" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle" >learned quantizer</text>
<rect x="815.0" y="268" width="110" height="64" rx="14" fill="#fff" stroke="#c9b3d9" stroke-width="1.8" filter="url(#sh)"/>
<text x="870" y="300" font-size="16" fill="#1d1626" font-weight="600" text-anchor="middle" >Dest.</text>
<text x="870" y="319" font-size="12.5" fill="#6d6578" font-weight="400" text-anchor="middle" >joint decoder</text>
<line x1="600" y1="266" x2="690" y2="192" stroke="#6d6578" stroke-width="2.2" marker-end="url(#ag)"/>
<line x1="600" y1="334" x2="690" y2="408" stroke="#6d6578" stroke-width="2.2" marker-end="url(#ag)"/>
<line x1="752" y1="192" x2="846" y2="262" stroke="#57068c" stroke-width="2.8" marker-end="url(#av)"/>
<line x1="806.2" y1="217.4" x2="791.8" y2="236.6" stroke="#57068c" stroke-width="3"/>
<text x="818" y="212" font-size="16" fill="#57068c" font-weight="700" text-anchor="middle" font-style="italic">R₁</text>
<line x1="752" y1="408" x2="846" y2="338" stroke="#57068c" stroke-width="2.8" marker-end="url(#av)"/>
<line x1="791.8" y1="363.4" x2="806.2" y2="382.6" stroke="#57068c" stroke-width="3"/>
<text x="818" y="400" font-size="16" fill="#57068c" font-weight="700" text-anchor="middle" font-style="italic">R₂</text>
<line x1="70" y1="532" x2="120" y2="532" stroke="#6d6578" stroke-width="2.2" marker-end="url(#ag)"/>
<text x="132" y="537" font-size="15" fill="#4a4257" font-weight="500" text-anchor="start" >noisy wireless link</text>
<line x1="340" y1="532" x2="390" y2="532" stroke="#57068c" stroke-width="2.8" marker-end="url(#av)"/>
<text x="402" y="537" font-size="15" fill="#4a4257" font-weight="500" text-anchor="start" >out-of-band link carrying R bits per channel use</text>
</svg>
