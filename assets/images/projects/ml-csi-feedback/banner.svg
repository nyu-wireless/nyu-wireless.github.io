<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Learned precoding-oriented CSI feedback</title>
  <desc id="d">A base station with a massive MIMO array sends learned pilots to three users. Each user runs a neural encoder and quantizer and feeds back a few bits. A precoding network at the base station maps the feedback bits directly to precoders.</desc>
