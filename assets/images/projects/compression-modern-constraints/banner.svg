<text x="363" y="402" font-size="12.5" fill="#1d1626" font-weight="500" text-anchor="middle">correlated in time</text>
</g>
<g transform="translate(9 0)">
<rect x="504" y="272" width="72" height="42" rx="9" fill="url(#vgrad)"/>
<text x="540" y="298" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">Enc</text>
<line x1="576" y1="293" x2="612" y2="322" stroke="#57068c" stroke-width="2.4" marker-end="url(#av)"/>
<rect x="614" y="308" width="46" height="42" rx="9" fill="#fff" stroke="#57068c" stroke-width="2.2"/>
<text x="637" y="334" font-size="12.5" fill="#1d1626" font-weight="600" text-anchor="middle">Dec</text>
<rect x="504" y="350" width="72" height="34" rx="9" fill="#efe7f5"/>
<text x="540" y="372" font-size="12" fill="#1d1626" font-weight="500" text-anchor="middle">side info</text>
<line x1="576" y1="366" x2="612" y2="342" stroke="#6d6578" stroke-width="2.2" marker-end="url(#ag)"/>
<text x="581" y="424" font-size="12.5" fill="#1d1626" font-weight="500" text-anchor="middle">at the decoder only</text>
</g>
<g transform="translate(11 0)">
<rect x="724" y="310" width="62" height="42" rx="9" fill="#fff" stroke="#57068c" stroke-width="2.2"/>
