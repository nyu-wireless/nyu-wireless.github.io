<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Compression under modern constraints</title>
  <desc id="d">A source is encoded to a small number of bits and decoded. Four panels show the constraints studied: single-shot coding, sources with memory, distributed side information, and multi-task decoding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9fc"/><stop offset="1" stop-color="#f1eaf6"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0" x2="1">
      <stop offset="0" stop-color="#57068c"/><stop offset="1" stop-color="#8900e1"/>
    </linearGradient>
    <marker id="av" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57068c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d6578"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00979a"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d6336c"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e0a32" flood-opacity=".10"/></filter>
  </defs>
  <rect width="960" height="576" fill="url(#bg)"/>
<rect x="44" y="44" width="872" height="108" rx="14" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<rect x="76" y="72" width="120" height="52" rx="12" fill="#efe7f5"/>
<text x="136" y="104" font-size="16" fill="#1d1626" font-weight="600" text-anchor="middle">Source</text>
<line x1="198" y1="98" x2="254" y2="98" stroke="#57068c" stroke-width="2.4" marker-end="url(#av)"/>
<rect x="256" y="68" width="136" height="60" rx="14" fill="url(#vgrad)"/>
<text x="324" y="104" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Encoder</text>
<line x1="392" y1="98" x2="444" y2="98" stroke="#57068c" stroke-width="2.4" marker-end="url(#av)"/>
<rect x="448" y="88" width="9" height="20" rx="2" fill="#c9b3d9"/>
<rect x="460" y="88" width="9" height="20" rx="2" fill="#57068c"/>
<rect x="472" y="88" width="9" height="20" rx="2" fill="#c9b3d9"/>
<rect x="484" y="88" width="9" height="20" rx="2" fill="#57068c"/>
<rect x="496" y="88" width="9" height="20" rx="2" fill="#c9b3d9"/>
<rect x="508" y="88" width="9" height="20" rx="2" fill="#57068c"/>
<text x="478" y="76" font-size="12.5" fill="#6d6578" font-weight="500" text-anchor="middle">few bits</text>
<line x1="522" y1="98" x2="572" y2="98" stroke="#57068c" stroke-width="2.4" marker-end="url(#av)"/>
<rect x="574" y="68" width="136" height="60" rx="14" fill="#fff" stroke="#57068c" stroke-width="2.5"/>
<text x="642" y="104" font-size="16" fill="#1d1626" font-weight="600" text-anchor="middle">Decoder</text>
<line x1="710" y1="98" x2="762" y2="98" stroke="#57068c" stroke-width="2.4" marker-end="url(#av)"/>
<rect x="764" y="72" width="120" height="52" rx="12" fill="#efe7f5"/>
<text x="824" y="104" font-size="16" fill="#1d1626" font-weight="600" text-anchor="middle">Output</text>
<rect x="44" y="186" width="212" height="346" rx="14" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<text x="150" y="224" font-size="16.5" fill="#57068c" font-weight="700" text-anchor="middle">Single-shot</text>
<text x="150" y="482" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">No long blocks: each</text>
<text x="150" y="504" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">sample is coded alone</text>
<rect x="264" y="186" width="212" height="346" rx="14" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<text x="370" y="224" font-size="16.5" fill="#57068c" font-weight="700" text-anchor="middle">Sources with memory</text>
<text x="370" y="482" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">Samples are correlated,</text>
<text x="370" y="504" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">not i.i.d.</text>
<rect x="484" y="186" width="212" height="346" rx="14" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<text x="590" y="224" font-size="16.5" fill="#57068c" font-weight="700" text-anchor="middle">Distributed</text>
<text x="590" y="482" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">Side information held</text>
<text x="590" y="504" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">elsewhere helps decode</text>
<rect x="704" y="186" width="212" height="346" rx="14" fill="#fff" stroke="#e4dde9" stroke-width="1.5" filter="url(#sh)"/>
<text x="810" y="224" font-size="16.5" fill="#57068c" font-weight="700" text-anchor="middle">Multi-task</text>
<text x="810" y="482" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">Reconstruct the data and</text>
<text x="810" y="504" font-size="13" fill="#6d6578" font-weight="400" text-anchor="middle">make inferences from it</text>
<g transform="translate(5 0)">
<rect x="128" y="290" width="34" height="34" rx="6" fill="#57068c"/>
<rect x="74" y="344" width="16" height="16" rx="3" fill="#ddd1e6"/>
