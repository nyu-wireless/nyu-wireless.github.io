  <title id="t">Neural distributed compression with decoder side information</title>
  <desc id="d">A learned encoder compresses a source X into R bits; a learned decoder combines the bits with side information Y, available only at the decoder. Below, a schematic of learned binning: the same quantization index is reused on intervals far apart, and the side information selects the right one.</desc>
